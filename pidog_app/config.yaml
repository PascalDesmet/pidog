# Pidog application configuration.
# Override any value with the corresponding uppercase environment variable,
# e.g. PIDOG_LLM_IP overrides llm.ip (dots -> underscores, prefix PIDOG_).

dog:
  name: "Scooby Doo"
  sleep_delay: 120 # seconds

llm:
  # Ollama runs on the laptop; expose it on the LAN in Ollama settings.
  ip: "192.168.0.136"
  port: 11434
  # Must support tool/function calling: llama3.1, qwen2.5, mistral-nemo, ...
  model: "qwen2.5:7b"
  max_messages: 20

io:
  # "text" | "voice"
  mode: "text"
  voice:
    stt_language: "en-us"
    tts_model: "en_US-ryan-low"   # Piper model
    wake_enable: true
    wake_word: ["hey scooby"]
    answer_on_wake: "Hi there buddy"
  sounds_path: "/home/pds/pidog/sounds/"

sensors:
  too_close_cm: 15
  like_touch_styles: ["RS"] # Front to rear slide
  hate_touch_styles: ["LS"] # Rear to front slide

vision:
  camera_vflip: false
  camera_hflip: false
  face_track_timeout: 30.0
  face_track_seen_hold: 10.0

guard:
  # seconds between photos while movement persists
  photo_interval: 10
  # stop taking photos after this many seconds without movement
  calm_timeout: 5
  # total seconds to keep watch per guard_the_perimeter call
  duration: 300
  # fraction of frame pixels that must change to count as movement
  motion_threshold: 0.02
  photos_dir: "surveillance_photos"

logging:
  level: INFO
  filename: app.log
